name: Tapthrough
description: Comment a preview link on every pull request that opens the change on the right screen, with test data and a test plan
author: Tapthrough
branding:
  icon: smartphone
  color: blue

inputs:
  platform:
    description: >-
      `expo` for an Expo app, `web` for a Next.js app on preview deployments, or `auto` to
      read it from the app's package.json.
    default: auto
  update-json:
    description: >-
      Expo only, required. File written by `eas update --json --non-interactive`, relative
      to working-directory.
  app-id:
    description: >-
      Web only, required. The app ID your launch route and seed hook use, e.g. your
      production hostname.
  preview-url:
    description: >-
      Web only. This PR's preview deployment. Left out, the Action waits for the GitHub
      deployment your host records for this commit (Vercel does), which needs
      `permissions: deployments: read`.
  preview-environment:
    description: >-
      Web only. The GitHub deployment environment to wait for, e.g. `Preview – acme-web`,
      when a commit deploys to more than one.
  preview-timeout:
    description: Web only. Seconds to wait for the preview deployment.
    default: "600"
  github-token:
    description: Web only. Lists this commit's deployments.
    default: ${{ github.token }}
  api-url:
    description: Tapthrough's base URL; also the audience of the GitHub OIDC token
    default: https://tapthrough-cloud.vercel.app
  working-directory:
    description: The app's directory
    default: .
  native-build-profile:
    description: >-
      EAS build profile for PRs that change native code. When no build exists for a PR's
      runtime version, the Action starts one (it runs on your EAS plan) and the PR's link
      shows it. Up to two, comma-separated (e.g. `development, development-simulator`),
      or `off`.
    default: development

outputs:
  links:
    description: JSON object of scenario key to preview link

runs:
  using: node24
  main: packages/action/dist/index.js
