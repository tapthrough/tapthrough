name: Tapthrough
description: Comment a preview link on every pull request that opens the change on the right screen, with test data and a test plan
author: Tapthrough
branding:
  icon: smartphone
  color: blue

inputs:
  update-json:
    description: File written by `eas update --json --non-interactive`, relative to working-directory
    required: true
  api-url:
    description: Tapthrough's base URL; also the audience of the GitHub OIDC token
    default: https://tapthrough-cloud.vercel.app
  working-directory:
    description: The Expo app's directory
    default: .
  native-build-profile:
    description: >-
      EAS build profile for PRs that change native code. When no build exists for a PR's
      runtime version, the Action starts one (it runs on your EAS plan) and the PR's link
      shows it. Up to two, comma-separated (e.g. `development, development-simulator`),
      or `off`.
    default: development

outputs:
  links:
    description: JSON object of scenario key to preview link

runs:
  using: node24
  main: packages/action/dist/index.js
